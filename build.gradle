plugins {
    id 'java'
    id 'maven-publish'
    // JReleaser for publishing to Maven Central
    id 'org.jreleaser' version '1.21.0'
    id 'checkstyle'
}

group = 'org.interledger'
version = project.findProperty('release.version') ?: '0.0.1-SNAPSHOT'
description = 'The OpenPayments Java SDK.'

// Set a proper artifact name
def artifactName = 'open-payments'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

ext {
    jacksonVersion = '2.17.1'
    junitVersion = '5.10.2'
    loggerVersion = '2.0.17'
    logbackClassicVersion = '1.5.17'
    lombokVersion = '1.18.42'
    mockitoVersion = '5.14.2'
}

// Define source sets for integration tests
sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        // Include classes from 'main' and 'test' source sets
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

// Create a configuration for integration test implementation dependencies
configurations {
    integrationTestImplementation {
        extendsFrom configurations.testImplementation
    }
    integrationTestRuntimeOnly {
        extendsFrom configurations.testRuntimeOnly
    }
}

// Create custom integrationTest task
tasks.register('integrationTest', Test) {
    description = 'Runs the integration tests.'
    group = 'verification'

    // Link this task to the `integrationTest` source set
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath

    useJUnitPlatform() // JUnit 5 platform for tests

    // Optional: Enable logging for debugging purposes
    testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
    }
}

// Configure duplicate handling for integration test resources
tasks.named('processIntegrationTestResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Standard test task
tasks.test {
    useJUnitPlatform()
    testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:all/public')
    failOnError = false
}

checkstyle {
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    toolVersion = '10.12.4'
    ignoreFailures = false
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    showViolations = true
    reports {
        xml.required = true
        xml.outputLocation = file("${rootDir}/build/reports/checkstyle/${project.name}-checkstyle.xml")
        html.required = true
        html.outputLocation = file("${rootDir}/build/reports/checkstyle/${project.name}-checkstyle.html")
    }
    ignoreFailures = false
    maxErrors = 0
    maxWarnings = 0
}

dependencies {
    // Compiling
    // Latest Lombok always.
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${loggerVersion}"

    // Serialization / Deserialization
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // Unit tests
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testImplementation "ch.qos.logback:logback-classic:${logbackClassicVersion}"

    // Integration tests - explicitly declare test framework dependencies
    integrationTestImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    integrationTestRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    integrationTestImplementation "ch.qos.logback:logback-classic:${logbackClassicVersion}"
    integrationTestImplementation project(':')

    // Needed for Gradle 9.0
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    integrationTestCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    integrationTestAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

publishing {
    repositories {
        maven {
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
    publications {
        maven(MavenPublication) {
            from components.java

            // Set the artifact name explicitly
            groupId = 'org.interledger'
            artifactId = artifactName

            pom {
                name = artifactName
                description = 'Java client for Interledger Open Payments protocol'
                url = 'https://github.com/interledger/open-payments-java'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'koekiebox'
                        name = 'Jason Bruwer'
                        email = 'jason@interledger.org'
                        organization = 'Interledger'
                        organizationUrl = 'https://interledger.org'
                    }
                    developer {
                        id = 'oana-lolea'
                        name = 'Oana Lolea'
                        email = 'oana.lolea@breakpointit.eu'
                        organization = 'Breakpoint'
                        organizationUrl = 'https://breakpointit.eu'
                    }
                }

                organization {
                    name = 'Interledger'
                    url = 'https://interledger.org'
                }

                scm {
                    connection = 'scm:git:git://github.com/interledger/open-payments-java.git'
                    developerConnection = 'scm:git:ssh://github.com/interledger/open-payments-java.git'
                    url = 'https://github.com/interledger/open-payments-java'
                }
            }
        }
    }
}

// Configure artifact signing for Maven Central via JReleaser (preferred)
jreleaser {
    project {
        // Used by JReleaser in release metadata/announcements
        copyright = "2025 Interledger"
    }
    // Reuse project info from Gradle (group, version, POM metadata)
    signing {
        active = 'ALWAYS'
        armored = true
        mode = 'MEMORY'
    }
    deploy {
        maven {
            // Use the new Central Portal publisher API
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                    username = (findProperty('JRELEASER_MAVENCENTRAL_USERNAME') ?: System.getenv('JRELEASER_MAVENCENTRAL_USERNAME'))
                    password = (findProperty('JRELEASER_MAVENCENTRAL_PASSWORD') ?: System.getenv('JRELEASER_MAVENCENTRAL_PASSWORD'))
                }
            }
        }
    }
}


