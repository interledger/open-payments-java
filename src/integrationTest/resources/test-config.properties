# OpenPayments Integration Test Template 
# This file contains configuration value examples for testing the OpenPayments API client.
# 
# IMPORTANT: Never commit the actual test-config.properties file to version control
# as it contains sensitive information like private keys.
# =============================================================================
# CLIENT WALLET CONFIGURATION
# =============================================================================

# This should be a valid Interledger wallet URL that can initiate payments
client.wallet.address=https://wallet-address/client

# The private key for the client wallet in PEM format
# This key is used to cryptographically sign requests to the Interledger network
# Format: PEM-encoded Ed25519 private key
client.private.key=-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY_HERE\n-----END PRIVATE KEY-----

# The key ID associated with the private key
# This is used by the Interledger network to identify which public key to use for verification
# Format: UUID string
client.key.id=164df9a0-46de-4f26-bde7-b0876fe30e9e

# =============================================================================
# TEST WALLET ADDRESSES
# =============================================================================

# Test wallet address for the payment sender
# This represents the wallet that will send money in test scenarios
sender.wallet.address=https://wallet-address/client/sender

# Test wallet address for the payment receiver
# This represents the wallet that will receive money in test scenarios
receiver.wallet.address=https://wallet-address/client/receiver

# =============================================================================
# ADDITIONAL CONFIGURATION
# =============================================================================

# Test environment URL (if different from production)
# This can be used to point to different Interledger test networks
# test.environment.url=https://wallet.interledger-test.dev

# Timeout settings for tests (in seconds)
# test.timeout.connect=10
# test.timeout.read=30
