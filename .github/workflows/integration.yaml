name: Integration Test

on:
  pull_request:
    branches: [ main ]

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up integration environment
        run: |
          cat <<EOF > src/integrationTest/resources/test-config.properties
          client.wallet.address=${{ secrets.CLIENT_WALLET_ADDRESS }}
          client.private.key=${{ secrets.CLIENT_PRIVATE_KEY }}
          client.key.id=${{ secrets.CLIENT_KEY_ID }}
          sender.wallet.address=${{ secrets.SENDER_WALLET_ADDRESS }}
          receiver.wallet.address=${{ secrets.RECEIVER_WALLET_ADDRESS }}
          EOF
      - name: Run integration tests
        run: ./gradlew integrationTest